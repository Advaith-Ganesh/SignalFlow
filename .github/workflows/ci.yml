name: CI

on:
  push:
    branches: [Main]
  pull_request:

jobs:
  backend:
    name: Python (lint, type-check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev/api dependencies
        run: pip install -e ".[api,dev]"

      - name: Ruff lint
        run: ruff check src backend scripts tests

      - name: Ruff format check
        run: ruff format --check src backend scripts tests

      - name: mypy (src/signalflow)
        run: mypy src/signalflow

      - name: mypy (backend/app)
        working-directory: backend
        run: mypy app

      - name: pytest
        run: pytest -q

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check + production build
        working-directory: frontend
        run: npm run build
